repos:
  - repo: local
    hooks:
      - id: format
        name: Format staged files
        entry: npx prettier --ignore-unknown --write
        language: system
        types: [file]
      - id: lint
        name: Lint
        entry: npm run lint
        language: system
        pass_filenames: false
        always_run: true
      - id: typecheck
        name: Typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
        always_run: true
      - id: test
        name: Tests
        entry: npm test
        language: system
        pass_filenames: false
        always_run: true
